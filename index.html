<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="description" content="AllTimer — habits, time-based workouts, wellness timers & calendar in one page.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AllTimer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>AllTimer — Habits, Workouts & Timers</title>
<style>
:root{
  --bg:#f3f4f6; --surface:#ffffff; --border:#e4e6ea; --text:#1a1d21; --muted:#767e8a;
  --accent:#3b82f6; --accent-soft:#e9f0fe; --danger:#ef4444; --danger-soft:#fee2e2;
  --ok:#10b981; --shadow:0 1px 3px rgba(16,24,40,.07); --shadow-lg:0 12px 32px rgba(16,24,40,.16);
}
:root[data-theme="dark"]{
  --bg:#0f1115; --surface:#191c22; --border:#292f38; --text:#e8eaee; --muted:#8b93a1;
  --accent:#5b9dff; --accent-soft:#1e2c44; --danger:#f87171; --danger-soft:#3a2226;
  --ok:#34d399; --shadow:0 1px 3px rgba(0,0,0,.4); --shadow-lg:0 12px 32px rgba(0,0,0,.5);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme]){ --bg:#0f1115; --surface:#191c22; --border:#292f38; --text:#e8eaee; --muted:#8b93a1;
    --accent:#5b9dff; --accent-soft:#1e2c44; --danger:#f87171; --danger-soft:#3a2226;
    --ok:#34d399; --shadow:0 1px 3px rgba(0,0,0,.4); --shadow-lg:0 12px 32px rgba(0,0,0,.5); }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh}

.app{display:flex;min-height:100vh}
.side{display:none}
.main{flex:1;min-width:0}

/* ---- Top bar ---- */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:6px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--border);backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;letter-spacing:.2px}
.brand .logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#8b5cf6);display:flex;align-items:center;justify-content:center;color:#fff}
.brand .logo svg{width:16px;height:16px}
.topbar .spacer{flex:1}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.icon-btn svg{width:19px;height:19px}

/* ---- Content ---- */
.content{max-width:760px;margin:0 auto;padding:16px 16px 96px}
.page-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.page-head h2{margin:0;font-size:22px;flex:1}
.page-head .sub{margin:2px 0 14px;color:var(--muted);font-size:13px;width:100%}

/* ---- Buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:12px;padding:11px 18px;font-size:14px;font-weight:600;cursor:pointer;background:var(--accent);color:#fff;transition:transform .05s ease, filter .15s}
.btn:active{transform:scale(.97)}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.danger{background:var(--danger)}
.btn.danger-ghost{background:var(--surface);color:var(--danger);border:1px solid var(--danger)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn svg{width:16px;height:16px}

/* ---- Cards ---- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{margin:0 0 8px;font-size:16px}
.muted{color:var(--muted);font-size:13px}

/* ---- Habits ---- */
.habit{display:flex;flex-direction:column;gap:8px}
.habit-top{display:flex;align-items:center;gap:10px}
.habit-top .check{width:26px;height:26px;min-width:26px;border-radius:8px;border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;background:var(--surface)}
.habit-top .check.done{background:var(--ok);border-color:var(--ok);color:#fff}
.habit-top .check svg{width:15px;height:15px;opacity:0}
.habit-top .check.done svg{opacity:1}
.dot{width:12px;height:12px;min-width:12px;border-radius:50%;display:inline-block}
.habit-name{font-weight:600;font-size:15px;flex:1;line-height:1.3}
.habit-actions{display:flex;gap:4px}
.habit-actions button{width:32px;height:32px;border:none;background:none;color:var(--muted);cursor:pointer;border-radius:8px;display:flex;align-items:center;justify-content:center}
.habit-actions button:hover{background:var(--accent-soft);color:var(--accent)}
.habit-actions svg{width:16px;height:16px}
.habit-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.streak{font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:20px;padding:3px 10px}
.week{display:flex;gap:4px;align-items:center}
.week i{width:9px;height:9px;border-radius:50%;background:var(--border)}
.week i.on{background:var(--ok)}
.subtasks{display:flex;flex-direction:column;gap:6px;padding-left:36px}
.subtasks label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer}
.subtasks input{width:17px;height:17px;accent-color:var(--ok)}
.subtasks .s-done{text-decoration:line-through;color:var(--muted)}

/* ---- Forms ---- */
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
.input,textarea.input,input.input{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text);font-size:15px;font-family:inherit}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:32px;height:32px;border-radius:50%;border:3px solid transparent;cursor:pointer;background:var(--c);transition:.12s}
.swatch.on{border-color:var(--text);transform:scale(1.12)}
.subrow{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.subrow .input{flex:1}
.x-btn{width:34px;height:34px;border:none;background:var(--danger-soft);color:var(--danger);border-radius:10px;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* ---- Workout editor ---- */
.mode-seg{display:flex;gap:6px;flex-wrap:wrap}
.mode-btn{flex:1;min-width:64px;padding:11px 8px;border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:12px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;transition:.1s}
.mode-btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.ex-row2{display:grid;grid-template-columns:1fr 64px 64px 30px;gap:6px;align-items:center;margin-bottom:6px}
.ex-row2 .input{padding:8px 9px;font-size:13px}
.ex-head2{display:grid;grid-template-columns:1fr 64px 64px 30px;gap:6px;margin-bottom:6px}
.ex-head2 span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;font-weight:600}
.ex-row{display:grid;grid-template-columns:1fr 46px 60px 60px 30px;gap:6px;align-items:center;margin-bottom:6px}
.ex-row .input{padding:8px 10px;font-size:14px}
.ex-chip{display:inline-block;font-size:12px;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:3px 9px;margin:2px 4px 2px 0}
.ex-list{display:flex;flex-direction:column;gap:8px}
.mode-badge{display:inline-block;font-size:10.5px;font-weight:700;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:2px 9px;vertical-align:middle;margin-left:6px;text-transform:uppercase}

/* ---- Modal ---- */
.overlay{position:fixed;inset:0;background:rgba(10,12,16,.55);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;z-index:100;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{width:100%;max-width:520px;max-height:88vh;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:20px 20px 24px;box-shadow:var(--shadow-lg);animation:up .18s}
@media (min-width:640px){
  .overlay{align-items:center}
  .modal{border-radius:22px;margin:0 16px}
}
@keyframes up{from{transform:translateY(24px);opacity:.4}}
.modal h3{margin:0 0 16px;font-size:19px}
.modal h4{margin:16px 0 8px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.modal-actions{display:flex;gap:10px;margin-top:18px}
.modal-actions .btn{flex:1}
.row{display:flex;align-items:center;gap:8px;padding:8px 0;font-size:14px;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none}
.row-check{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:15px;cursor:pointer;border-bottom:1px solid var(--border)}
.row-check:last-child{border-bottom:none}
.row-check input{width:18px;height:18px;accent-color:var(--ok)}

/* ---- Timers ---- */
.timer-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.timer-card-mini{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.timer-card-mini .t-name{font-weight:700;font-size:15px}
.timer-card-mini .t-desc{font-size:12px;color:var(--muted);line-height:1.45}
.timer-card-mini .t-btns{display:flex;gap:6px}
.timer-card-mini .t-btns .btn{flex:1}

.overlay-card{width:100%;max-width:400px;background:var(--surface);border-radius:24px;padding:28px 24px;text-align:center;box-shadow:var(--shadow-lg);animation:up .2s}
.overlay-card .t-name{font-size:16px;font-weight:700}
.overlay-card .t-phase{margin-top:4px;font-size:13px;color:var(--muted)}
.overlay-card .t-time{font-size:64px;font-weight:700;letter-spacing:2px;font-variant-numeric:tabular-nums;margin:14px 0 6px}
.t-progress{height:8px;background:var(--border);border-radius:99px;overflow:hidden;margin:14px 0 20px}
.t-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .2s linear}
.t-btns{display:flex;gap:10px;justify-content:center}
.t-btns .btn{min-width:110px}

/* ---- Dashboard Today ---- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.stats .stat b{display:block;font-size:24px;line-height:1.2}
.stats .stat span{font-size:11px;color:var(--muted)}
.bar{height:10px;background:var(--border);border-radius:99px;overflow:hidden;margin-top:10px}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),#8b5cf6);border-radius:99px;transition:width .3s}
.row.click{cursor:pointer}
.row.click:active{background:var(--accent-soft)}
.check-mini{width:24px;height:24px;min-width:24px;border-radius:8px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;color:transparent;transition:.15s}
.check-mini svg{width:13px;height:13px}
.check-mini.done{background:var(--ok);border-color:var(--ok);color:#fff}
.streak.best{background:var(--surface);color:var(--muted);border:1px solid var(--border)}

/* ---- Heatmap ---- */
.heatmap-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.heatmap{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,10px);grid-auto-columns:10px;gap:3px;width:max-content}
.hm-cell{width:10px;height:10px;border-radius:2.5px;background:var(--border);cursor:pointer}
.hm-cell.l1{background:rgba(59,130,246,.3)}
.hm-cell.l2{background:rgba(59,130,246,.55)}
.hm-cell.l3{background:rgba(59,130,246,.8)}
.hm-cell.l4{background:#3b82f6}
.hm-legend{display:flex;align-items:center;gap:4px;margin-top:10px;font-size:10px;color:var(--muted)}
.hm-legend .hm-cell{display:inline-block;margin:0 1px}

/* ---- Workout session (minimal fullscreen timer) ---- */
.workout-overlay{position:fixed;inset:0;z-index:90;background:#0b0e13;color:#f4f6f8;display:flex;flex-direction:column;padding:max(18px,env(safe-area-inset-top)) 22px max(20px,env(safe-area-inset-bottom));-webkit-user-select:none;user-select:none}
.wo-top{display:flex;align-items:center;gap:10px;font-size:13px;color:#8b93a1}
.wo-name{flex:1;font-weight:700;color:#e8ecf1;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wo-round{background:#1a2029;padding:4px 11px;border-radius:99px;font-weight:700;color:#dfe5ec;white-space:nowrap}
.wo-pct{font-weight:800;color:#5b9dff;font-size:16px;min-width:48px;text-align:right}
.wo-next{margin-top:auto;text-align:center;color:#7c8694;font-size:clamp(13px,3vw,19px);font-weight:600;text-transform:uppercase;letter-spacing:.6px;min-height:24px}
.wo-next b{color:#b9c1cc;font-weight:700}
.wo-current{margin-top:14px;text-align:center;font-size:clamp(44px,11vw,96px);font-weight:800;line-height:1.05;word-break:break-word;color:#f4f6f8}
.wo-current.rest{color:#5b9dff}
.wo-time{margin-top:10px;text-align:center;font-size:clamp(64px,18vw,150px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:1px}
.wo-phase{margin-top:8px;text-align:center;font-size:13px;color:#8b93a1;min-height:18px;text-transform:uppercase;letter-spacing:.5px}
.wo-adjust{display:flex;gap:8px;justify-content:center;margin:6px 0 2px}
.wo-adjust button{padding:9px 14px;border:1px solid #262d38;background:transparent;color:#aeb6c2;border-radius:99px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.wo-adjust button:active{background:#1a2029}
.wo-progress{height:10px;background:#1a2029;border-radius:99px;overflow:hidden;margin:24px 0 18px}
.wo-fill{height:100%;background:linear-gradient(90deg,#5b9dff,#8b5cf6);border-radius:99px;width:0;transition:width .2s linear}
.wo-btns{display:flex;gap:10px}
.wo-btns button{flex:1;padding:17px 6px;border:none;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
#woPause{background:#5b9dff;color:#0b0e13}
#woSkip{background:#1f2733;color:#dfe5ec}
#woFinish{background:#f43f5e;color:#fff}
#woQuit{flex:.6;background:transparent;color:#6b7482;font-size:13px;border:1px solid #262d38}

/* ---- Calendar ---- */
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.cal-head span{text-align:center;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-day{min-height:56px;border:1px solid var(--border);border-radius:10px;background:var(--surface);padding:5px;display:flex;flex-direction:column;gap:2px;cursor:pointer;align-items:flex-start;font-family:inherit;color:var(--text);text-align:left}
.cal-day:hover{border-color:var(--accent)}
.cal-day.out{opacity:.32;pointer-events:none}
.cal-day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.dnum{font-size:12px;font-weight:600}
.cal-dots{display:flex;flex-wrap:wrap;gap:2px;margin-top:auto}
.dot-s{width:8px;height:8px;border-radius:50%}
.cal-badges{display:flex;gap:3px;flex-wrap:wrap}
.badge{font-size:9px;font-weight:700;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:1px 5px}
.badge.w{background:var(--danger-soft);color:var(--danger)}
.month-nav{display:flex;align-items:center;gap:8px}
.month-nav h2{flex:1;text-align:center;font-size:18px;margin:0}

/* ---- Stats & gamification ---- */
.chart-box{position:relative;width:100%;height:150px}
.chart-box.h{height:170px}
canvas.chart{width:100%;height:100%;display:block}
.level-card{display:flex;align-items:center;gap:14px}
.level-badge{width:54px;height:54px;min-width:54px;border-radius:16px;background:linear-gradient(135deg,var(--accent),#8b5cf6);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;box-shadow:var(--shadow)}
.level-badge b{font-size:20px;line-height:1}
.level-badge span{font-size:9px;font-weight:600;opacity:.9;text-transform:uppercase;letter-spacing:.5px}
.level-right{flex:1;min-width:0}
.level-name{font-weight:700;font-size:15px}
.xp-bar{height:10px;background:var(--border);border-radius:99px;overflow:hidden;margin-top:8px}
.xp-fill{height:100%;background:linear-gradient(90deg,var(--accent),#8b5cf6);border-radius:99px;transition:width .3s}
.xp-meta{font-size:11.5px;color:var(--muted);margin-top:5px}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ach{border:1px solid var(--border);border-radius:14px;padding:10px;background:var(--bg);display:flex;flex-direction:column;gap:2px}
.ach .em{font-size:22px;line-height:1}
.ach b{font-size:12.5px;margin-top:4px}
.ach span{font-size:10.5px;color:var(--muted);line-height:1.35}
.ach.locked{opacity:.45;filter:grayscale(1)}
.ach.new{outline:2px solid var(--ok);outline-offset:1px}
.habit-row-s{display:flex;align-items:center;gap:8px;font-size:13px;padding:7px 0;border-bottom:1px solid var(--border)}
.habit-row-s:last-child{border-bottom:none}
.habit-row-s .grow{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.habit-row-s .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-bar{flex:1;height:6px;background:var(--border);border-radius:99px;overflow:hidden;max-width:120px}
.mini-bar i{display:block;height:100%;background:var(--ok)}

/* ---- Notes ---- */
.notes-edit{margin-top:6px}
.notes-edit textarea{min-height:70px;resize:vertical}
.cal-note{width:14px;height:3px;border-radius:99px;background:var(--accent);margin-top:auto}
.badge.n{background:var(--accent-soft);color:var(--accent)}

/* ---- Google Drive sync ---- */
.drive-head{display:flex;align-items:center;gap:10px}
.drive-dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.drive-dot.on{background:var(--ok)}
.drive-dot.busy{background:var(--accent)}
.hint{font-size:12px;color:var(--muted);line-height:1.55}
.hint code{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:1px 5px;font-size:11px}
.drive-actions{display:flex;flex-wrap:wrap;gap:8px}
.drive-actions .btn{flex:1;min-width:120px}

/* ---- Books ---- */
.book-year{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:18px 0 8px}
.book-card{display:flex;align-items:flex-start;gap:10px}
.book-card .b-title{font-weight:700;font-size:15px;flex:1}
.book-card .b-meta{font-size:12.5px;color:var(--muted)}
.rating{display:flex;align-items:center;gap:1px;margin-top:5px}
.rating i{width:15px;height:15px;display:inline-flex;align-items:center;justify-content:center;color:var(--accent)}
.rating i.off{opacity:.25}
.rating i svg{width:13px;height:13px}
.book-summary{font-size:13px;color:var(--muted);line-height:1.5;margin-top:6px;white-space:pre-wrap}
.stars{display:flex;gap:2px;font-size:26px;line-height:1}
.star{cursor:pointer;color:var(--border);user-select:none;transition:transform .05s}
.star.on{color:var(--accent)}
.star:active{transform:scale(.85)}
.badge.book{background:var(--accent-soft);color:var(--accent)}

/* ---- Settings ---- */
.seg{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.seg button{flex:1;padding:10px;border:none;background:none;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
.toggle-row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.toggle{position:relative;width:46px;height:26px;flex:none}
.toggle input{opacity:0;width:0;height:0}
.toggle .track{position:absolute;inset:0;background:var(--border);border-radius:99px;transition:.15s;cursor:pointer}
.toggle .track:before{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.toggle input:checked + .track{background:var(--ok)}
.toggle input:checked + .track:before{transform:translateX(20px)}

/* ---- Nav ---- */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:60;background:var(--surface);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(8,1fr);padding-bottom:env(safe-area-inset-bottom)}
.nav-sep{display:none}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:9px 0 8px;border:none;background:none;color:var(--muted);font-size:10.5px;font-weight:600;cursor:pointer;font-family:inherit}
.nav button svg{width:22px;height:22px}
.nav button.active{color:var(--accent)}

/* ---- Toast ---- */
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:200;box-shadow:var(--shadow-lg);max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---- Desktop ---- */
@media (min-width:900px){
  .side{display:flex;flex-direction:column;width:230px;min-width:230px;background:var(--surface);border-right:1px solid var(--border);padding:20px 14px;position:sticky;top:0;height:100vh}
  .side .brand{font-size:18px;padding:0 6px;margin-bottom:26px}
  .side .nav{position:static;display:flex;flex-direction:column;gap:4px;grid-template-columns:none;background:none;border:none;padding:0;margin-bottom:16px}
  .side .nav button{flex-direction:row;justify-content:flex-start;gap:12px;padding:11px 12px;border-radius:12px;font-size:14px;width:100%}
  .side .nav button i{width:34px;height:26px}
  .side .nav button.active{background:var(--accent-soft)}
  .side .nav .nav-sep{display:block;height:1px;background:var(--border);margin:8px 12px}
  .side .side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
  .topbar{position:static;justify-content:flex-end}
  .topbar .brand{display:none}
  .content{padding:24px 28px 60px;max-width:860px}
}

<script>
"use strict";

/* ---------------- Utilities ---------------- */
const $ = s => document.querySelector(s);
const el = (tag, attrs, html) => { const n = document.createElement(tag); if (attrs) for (const k in attrs) n.setAttribute(k, attrs[k]); if (html != null) n.innerHTML = html; return n; };
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const pad = n => String(n).padStart(2, "0");
const toISO = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const todayStr = () => toISO(new Date());
const parseISO = s => { const p = s.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtClock = s => { s = Math.max(0, Math.round(s)); const m = Math.floor(s / 60); return m + ":" + pad(s % 60); };
const fmtDuration = sec => { sec = Math.round(sec || 0); const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60; if (h) return h + "h " + pad(m) + "m"; if (m) return m + "m " + pad(s) + "s"; return s + "s"; };
const fmtDateLong = ds => parseISO(ds).toLocaleDateString("en-US", { weekday: "long", year: "numeric", month: "long", day: "numeric" });
const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const COLORS = ["#3b82f6", "#8b5cf6", "#ef4444", "#10b981", "#f59e0b", "#ec4899", "#06b6d4", "#84cc16"];
const todayISO = todayStr();

/* ---------------- Sound ---------------- */
let audioCtx = null;
function beep(freq, dur, vol) {
  if (!state.settings.sound) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}
function alarm() { beep(880, .5, .25); setTimeout(() => beep(660, .5, .25), 700); setTimeout(() => beep(440, .7, .25), 1400); }

/* ---------------- Sound cues & vibration ---------------- */
function buzz(pattern) { try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {} }
function cueGo() { beep(980, .18, .22); buzz(90); }
function cueRest() { beep(520, .28, .2); buzz(200); }
function cueDone() { alarm(); buzz([220, 120, 220]); }
function cueForLabel(label) {
  const l = (label || "").toLowerCase();
  if (l.includes("break") || l.includes("rest") || l.includes("pause") || l.includes("hold")) cueRest(); else cueGo();
}

/* ---------------- Notifications & daily reminders ---------------- */
function notify(title, body) {
  if (!state.settings.notify) return;
  try {
    if ("Notification" in window && Notification.permission === "granted") {
      const n = new Notification(title, { body: body || "", tag: "alltimer" });
      setTimeout(() => n.close(), 8000);
    }
  } catch (e) {}
}
let reminderTimer = null;
function scheduleReminders() {
  clearTimeout(reminderTimer);
  const due = state.habits.filter(h => h.remind);
  if (!due.length) return;
  const now = new Date();
  let next = null;
  due.forEach(h => {
    const p = h.remind.split(":").map(Number);
    const t = new Date(now); t.setHours(p[0], p[1], 0, 0);
    if (t <= now) t.setDate(t.getDate() + 1);
    if (!next || t < next) next = t;
  });
  reminderTimer = setTimeout(() => {
    const key = pad(next.getHours()) + ":" + pad(next.getMinutes());
    due.filter(h => h.remind === key).forEach(h => notify("Habit reminder", h.name + " — daily check-in"));
    scheduleReminders();
  }, Math.max(1000, next - now));
}

/* ---------------- Icons ---------------- */
const ICONS = {
  today: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  habits: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  workouts: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg>',
  timers: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5"/><path d="M9 2h6"/></svg>',
  stats: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>',
  books: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
  calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 9.5h18"/></svg>',
  settings: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg>'
};
const iCheck = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
const iEdit = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l4 4L8 20l-5 1 1-5z"/></svg>';
const iTrash = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>';
const iMoon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const iSun = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const iStar = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.26 6.6.6-5 4.4 1.5 6.5L12 16.6 5.9 19.8l1.5-6.5-5-4.4 6.6-.6z"/></svg>';

/* ---------------- State & persistence ---------------- */
const KEY = "alltimer_data_v1";
let state = null;

function defaultData() {
  const mkHabit = (name, color) => ({ id: uid(), name, color, target: 7, subtasks: [], created: todayISO });
  const mkTimer = (name, repeat, phases) => ({ id: uid(), name, repeat, phases });
  const mkEx = (name, duration, rest) => ({ id: uid(), name, duration, rest });
  return {
    version: 4,
    habits: [
      mkHabit("Drink water", "#3b82f6"),
      mkHabit("Read 20 min", "#8b5cf6")
    ],
    habitLogs: {},
    workouts: [
      { id: uid(), name: "EMOM - Push-ups", mode: "emom", rounds: 8, cap: 600, exercises: [mkEx("Push-ups", 40, 20)] },
      { id: uid(), name: "Tabata - Full body", mode: "tabata", rounds: 8, cap: 600, exercises: [mkEx("Squats", 20, 10), mkEx("Push-ups", 20, 10), mkEx("Plank", 20, 10)] },
      { id: uid(), name: "AMRAP - 10 min", mode: "amrap", rounds: 0, cap: 600, exercises: [mkEx("Squats", 30, 15), mkEx("Burpees", 30, 15)] },
      { id: uid(), name: "Interval circuit", mode: "interval", rounds: 3, cap: 600, exercises: [mkEx("Squats", 40, 10), mkEx("Push-ups", 40, 10), mkEx("Plank", 40, 10)] }
    ],
    sessions: [],
    timerPresets: [
      mkTimer("Pomodoro", 4, [{ label: "Work", sec: 25 * 60 }, { label: "Break", sec: 5 * 60 }]),
      mkTimer("Meditation", 1, [{ label: "Meditate", sec: 10 * 60 }]),
      mkTimer("Wim Hof", 3, [{ label: "Breathing", sec: 120 }, { label: "Hold", sec: 90 }])
    ],
    timerLogs: [],
    notes: {},
    xp: 0,
    achievements: {},
    books: [],
    wishlist: [],
    settings: { theme: "auto", sound: true, notify: false }
  };
}

function migrate() {
  if (!state.notes) state.notes = {};
  if (state.xp == null) state.xp = 0;
  if (!state.achievements) state.achievements = {};
  if (!Array.isArray(state.books)) state.books = [];
  if (!Array.isArray(state.wishlist)) state.wishlist = [];
  (state.books || []).forEach(b => { if (b.isbn == null) b.isbn = ""; if ((b.rating || 0) > 5) b.rating = Math.max(0, Math.min(5, Math.round((b.rating || 0) / 2))); });
  (state.wishlist || []).forEach(w => { if (w.isbn == null) w.isbn = ""; });
  (state.workouts || []).forEach(w => {
    if (!w.mode) w.mode = "interval";
    if (w.cap == null) w.cap = 600;
    if (w.rounds == null) w.rounds = 3;
    if (Array.isArray(w.exercises) && w.exercises[0] && "sets" in w.exercises[0]) {
      w.exercises = w.exercises.map(e => ({ id: e.id || uid(), name: e.name || "Exercise", duration: 40, rest: (e.rest == null ? 10 : e.rest) }));
    }
    if (!Array.isArray(w.exercises)) w.exercises = [];
    w.exercises = w.exercises.map(e => ({ id: e.id || uid(), name: e.name || "Exercise", duration: Math.max(1, +e.duration || 40), rest: Math.max(0, e.rest == null ? 10 : +e.rest) }));
  });
  const hasNewMode = state.workouts.some(w => w.mode === "emom" || w.mode === "tabata" || w.mode === "amrap");
  if (!hasNewMode) {
    const mkEx = (name, duration, rest) => ({ id: uid(), name, duration, rest });
    state.workouts.unshift(
      { id: uid(), name: "EMOM - Push-ups", mode: "emom", rounds: 8, cap: 600, exercises: [mkEx("Push-ups", 40, 20)] },
      { id: uid(), name: "Tabata - Full body", mode: "tabata", rounds: 8, cap: 600, exercises: [mkEx("Squats", 20, 10), mkEx("Push-ups", 20, 10), mkEx("Plank", 20, 10)] },
      { id: uid(), name: "AMRAP - 10 min", mode: "amrap", rounds: 0, cap: 600, exercises: [mkEx("Squats", 30, 15), mkEx("Burpees", 30, 15)] }
    );
  }
}

function load() {
  const d = defaultData();
  state = d;
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const p = JSON.parse(raw);
      Object.assign(state, d, p);
      state.settings = Object.assign({}, d.settings, (p && p.settings) || {});
      if (!Array.isArray(state.habits)) state.habits = [];
      if (!Array.isArray(state.workouts)) state.workouts = [];
      if (!Array.isArray(state.sessions)) state.sessions = [];
      if (!Array.isArray(state.timerPresets)) state.timerPresets = [];
      if (!Array.isArray(state.timerLogs)) state.timerLogs = [];
      if (!state.notes) state.notes = {};
      if (state.xp == null) state.xp = 0;
      if (!state.achievements) state.achievements = {};
      if (!Array.isArray(state.books)) state.books = [];
      if (!Array.isArray(state.wishlist)) state.wishlist = [];
    }
  } catch (e) { console.warn("load failed", e); }
  migrate();
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { console.warn("save failed", e); }
  if (gdrive.autoPush && gdrive.clientId && gdrive.fileId) {
    clearTimeout(pushTimer);
    pushTimer = setTimeout(() => pushToDrive(true), 2500);
  }
}

/* ---------------- Theme ---------------- */
function applyTheme() {
  const t = state.settings.theme;
  const dark = t === "dark" || (t === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  const icon = dark ? iSun : iMoon;
  const b1 = $("#themeBtn"), b2 = $("#themeBtnTop");
  if (b1) b1.innerHTML = icon + " " + (dark ? "Light mode" : "Dark mode");
  if (b2) b2.innerHTML = icon;
}
function quickTheme() {
  const cur = document.documentElement.dataset.theme;
  state.settings.theme = cur === "dark" ? "light" : "dark";
  save(); applyTheme(); if (currentView === "settings") renderSettings();
}

/* ---------------- Toast ---------------- */
let toastTimer = null;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

/* ---------------- Modal ---------------- */
let modalOverlay = null;
function openModal(html, onMount) {
  closeModal();
  const ov = el("div", { class: "overlay" });
  ov.innerHTML = '<div class="modal">' + html + "</div>";
  ov.addEventListener("mousedown", e => { if (e.target === ov) closeModal(); });
  document.body.appendChild(ov);
  modalOverlay = ov;
  if (onMount) onMount(ov);
}
function closeModal() { if (modalOverlay) { modalOverlay.remove(); modalOverlay = null; } }
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

/* ---------------- Gamification (XP, levels, achievements) ---------------- */
const LEVEL_NAMES = ["Beginner", "Explorer", "Regular", "Disciplined", "Athlete", "Warrior", "Master", "Legend"];
const XP_PER_LEVEL = 100;
const XP_HABIT = 10, XP_SUB = 2, XP_WORKOUT = 25, XP_TIMER = 10, XP_NOTE = 5, XP_BOOK = 15;
const ACHIEVEMENTS = [
  { id: "first", icon: "🌱", name: "First steps", desc: "Complete your first habit", earned: s => s.done >= 1 },
  { id: "week", icon: "🔥", name: "On a roll", desc: "Reach a 7-day habit streak", earned: s => s.bestStreak >= 7 },
  { id: "month", icon: "⚡", name: "Unstoppable", desc: "Reach a 30-day habit streak", earned: s => s.bestStreak >= 30 },
  { id: "hundred", icon: "💯", name: "Century club", desc: "Complete 100 habits in total", earned: s => s.done >= 100 },
  { id: "day", icon: "🌟", name: "Perfect day", desc: "Complete every habit in one day", earned: s => s.perfectDay },
  { id: "athlete", icon: "💪", name: "Athlete", desc: "Complete 10 workouts", earned: s => s.workouts >= 10 },
  { id: "grinder", icon: "🏋️", name: "Grinder", desc: "Complete 50 workouts", earned: s => s.workouts >= 50 },
  { id: "zen", icon: "🧘", name: "Zen master", desc: "Complete 25 wellness timers", earned: s => s.timers >= 25 },
  { id: "early", icon: "🌅", name: "Early bird", desc: "Complete a habit before 9 AM", earned: s => s.earlyBird },
  { id: "scribe", icon: "✍️", name: "Scribe", desc: "Write a daily note", earned: s => s.notes >= 1 },
  { id: "book1", icon: "📖", name: "Bookworm", desc: "Read your first book", earned: s => s.books >= 1 },
  { id: "book10", icon: "📚", name: "Librarian", desc: "Read 10 books", earned: s => s.books >= 10 },
  { id: "book25", icon: "🎓", name: "Scholar", desc: "Read 25 books", earned: s => s.books >= 25 }
];
function levelOf(xp) {
  const level = Math.floor((xp || 0) / XP_PER_LEVEL) + 1;
  return { level, name: LEVEL_NAMES[Math.min(LEVEL_NAMES.length - 1, level - 1)], into: (xp || 0) % XP_PER_LEVEL };
}
function xpStats() {
  let done = 0, perfectDay = false, earlyBird = false;
  Object.keys(state.habitLogs || {}).forEach(ds => {
    const day = state.habitLogs[ds], habits = state.habits;
    let d = 0;
    habits.forEach(h => {
      if (day[h.id] && day[h.id].done) {
        d++;
        if (day[h.id].at) { const dt = new Date(day[h.id].at); if (dt.getHours() + dt.getMinutes() / 60 < 9) earlyBird = true; }
      }
    });
    done += d;
    if (habits.length && d === habits.length) perfectDay = true;
  });
  let bestStreak = 0;
  state.habits.forEach(h => { bestStreak = Math.max(bestStreak, bestStreakOf(h)); });
  return { done, bestStreak, perfectDay, workouts: (state.sessions || []).length, timers: (state.timerLogs || []).length, notes: Object.keys(state.notes || {}).filter(k => state.notes[k]).length, earlyBird, books: (state.books || []).length };
}
function checkAchievements() {
  const s = xpStats(), fresh = [];
  ACHIEVEMENTS.forEach(a => {
    if (!state.achievements[a.id] && a.earned(s)) { state.achievements[a.id] = todayISO; fresh.push(a); }
  });
  return fresh;
}
function addXp(n) {
  const before = levelOf(state.xp);
  state.xp = Math.max(0, (state.xp || 0) + n);
  const after = levelOf(state.xp);
  const fresh = checkAchievements();
  save();
  if (after.level > before.level) toast("Level up! You reached level " + after.level + " — " + after.name + " 👏");
  fresh.forEach((a, i) => setTimeout(() => toast("Achievement unlocked: " + a.icon + " " + a.name), i * 1600));
  return fresh;
}

/* ---------------- Habits ---------------- */
function isDoneOn(hid, ds) { return !!(state.habitLogs[ds] && state.habitLogs[ds][hid] && state.habitLogs[ds][hid].done); }
function streakOf(habit) {
  let s = 0, d = new Date();
  if (!isDoneOn(habit.id, toISO(d))) d = addDays(d, -1);
  while (isDoneOn(habit.id, toISO(d))) { s++; d = addDays(d, -1); }
  return s;
}
function last7(habit) {
  const out = [];
  for (let i = 6; i >= 0; i--) out.push(isDoneOn(habit.id, toISO(addDays(new Date(), -i))));
  return out;
}
function toggleHabit(hid, ds) {
  ds = ds || todayISO;
  state.habitLogs[ds] = state.habitLogs[ds] || {};
  const cur = state.habitLogs[ds][hid] || { done: false, subtasks: {} };
  cur.done = !cur.done;
  if (cur.done) cur.at = Date.now(); else delete cur.at;
  state.habitLogs[ds][hid] = cur;
  addXp(cur.done ? XP_HABIT : -XP_HABIT);
  renderAll();
}
function toggleSubtask(hid, sid, ds) {
  ds = ds || todayISO;
  state.habitLogs[ds] = state.habitLogs[ds] || {};
  const cur = state.habitLogs[ds][hid] || { done: false, subtasks: {} };
  cur.subtasks[sid] = !cur.subtasks[sid];
  state.habitLogs[ds][hid] = cur;
  addXp(cur.subtasks[sid] ? XP_SUB : -XP_SUB);
  renderAll();
}

function bestStreakOf(h) {
  const dates = Object.keys(state.habitLogs).filter(ds => isDoneOn(h.id, ds)).sort();
  let best = 0, run = 0, prev = null;
  dates.forEach(ds => {
    const d = parseISO(ds);
    if (prev) { run = (Math.round((d - prev) / 86400000) === 1) ? run + 1 : 1; }
    else run = 1;
    prev = d;
    if (run > best) best = run;
  });
  return best;
}
function habitStats() {
  const total = state.habits.length;
  if (!total) return { total: 0, todayDone: 0, pct7: 0, best: 0 };
  const todayDone = state.habits.filter(h => isDoneOn(h.id, todayISO)).length;
  let done7 = 0, slots7 = 0;
  for (let i = 6; i >= 0; i--) { const ds = toISO(addDays(new Date(), -i)); state.habits.forEach(h => { slots7++; if (isDoneOn(h.id, ds)) done7++; }); }
  const best = state.habits.reduce((m, h) => Math.max(m, bestStreakOf(h)), 0);
  return { total, todayDone, pct7: Math.round(done7 / slots7 * 100), best };
}
function heatmapHTML() {
  const max = Math.max(1, state.habits.length);
  const start = addDays(new Date(), -363);
  let cells = "";
  for (let w = 0; w < 52; w++) {
    for (let d = 0; d < 7; d++) {
      const ds = toISO(addDays(start, w * 7 + d));
      let n = 0; state.habits.forEach(h => { if (isDoneOn(h.id, ds)) n++; });
      const lvl = n === 0 ? 0 : Math.max(1, Math.round((n / max) * 4));
      cells += '<div class="hm-cell' + (lvl ? " l" + lvl : "") + '" onclick="openDay(\'' + ds + '\')" title="' + fmtDateLong(ds) + " · " + n + "/" + max + '"></div>';
    }
  }
  return '<div class="card"><h3>Heatmap <span class="muted" style="font-size:12px;font-weight:400">last 52 weeks</span></h3>' +
    '<div class="heatmap-wrap"><div class="heatmap">' + cells + "</div></div>" +
    '<div class="hm-legend"><span>Less</span><i class="hm-cell"></i><i class="hm-cell l1"></i><i class="hm-cell l2"></i><i class="hm-cell l3"></i><i class="hm-cell l4"></i><span>More</span></div></div>';
}

/* ---------------- Stats & charts ---------------- */
function weeklyData() {
  const labels = [], values = [];
  for (let w = 7; w >= 0; w--) {
    const start = addDays(new Date(), -(w * 7 + 6));
    let done = 0, slots = 0;
    for (let d = 0; d < 7; d++) { const ds = toISO(addDays(start, d)); state.habits.forEach(h => { slots++; if (isDoneOn(h.id, ds)) done++; }); }
    labels.push(start.toLocaleDateString("en-US", { month: "short", day: "numeric" }));
    values.push(slots ? Math.round(done / slots * 100) : 0);
  }
  return { labels, values };
}
function dailyData() {
  const values = [];
  for (let i = 29; i >= 0; i--) { const ds = toISO(addDays(new Date(), -i)); let d = 0; state.habits.forEach(h => { if (isDoneOn(h.id, ds)) d++; }); values.push(d); }
  return values;
}
function weekdayData() {
  const labels = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  const counts = [0, 0, 0, 0, 0, 0, 0], days = [0, 0, 0, 0, 0, 0, 0];
  for (let i = 55; i >= 0; i--) {
    const d = addDays(new Date(), -i), ds = toISO(d), wd = (d.getDay() + 6) % 7;
    days[wd]++; let n = 0; state.habits.forEach(h => { if (isDoneOn(h.id, ds)) n++; }); counts[wd] += n;
  }
  return { labels, values: counts.map((c, i) => days[i] ? Math.round(c / days[i] * 10) / 10 : 0) };
}
function chartCanvas(el) {
  const dpr = window.devicePixelRatio || 1;
  const w = el.clientWidth, h = el.clientHeight;
  el.width = Math.round(w * dpr); el.height = Math.round(h * dpr);
  const ctx = el.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w, h };
}
function cssC(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || ""; }
function roundRectPath(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function drawBarChart(canvas, labels, values, opts) {
  if (!canvas) return;
  const { ctx, w, h } = chartCanvas(canvas);
  ctx.clearRect(0, 0, w, h);
  const padL = 30, padB = 22, padT = 6, padR = 4;
  const iw = w - padL - padR, ih = h - padT - padB;
  const max = opts.max || Math.max(1, ...values);
  const n = values.length;
  const bw = Math.min(iw / n, 30), step = iw / n;
  ctx.font = "9px system-ui, sans-serif";
  ctx.lineWidth = 1;
  for (let g = 0; g <= 4; g++) {
    const y = padT + ih - (ih * g / 4);
    ctx.strokeStyle = opts.border; ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
    ctx.fillStyle = opts.muted; ctx.textAlign = "right"; ctx.textBaseline = "middle";
    ctx.fillText(String(Math.round(max * g / 4)), padL - 4, y);
  }
  ctx.textBaseline = "top";
  for (let i = 0; i < n; i++) {
    const v = values[i], x = padL + step * i + (step - bw) / 2;
    const bh = Math.max(2, (v / max) * ih), y = padT + ih - bh;
    ctx.fillStyle = opts.color; roundRectPath(ctx, x, y, bw, bh, 3); ctx.fill();
    if (labels[i]) { ctx.fillStyle = opts.muted; ctx.textAlign = "center"; ctx.fillText(labels[i], x + bw / 2, padT + ih + 5); }
  }
}
function drawLineChart(canvas, values, opts) {
  if (!canvas) return;
  const { ctx, w, h } = chartCanvas(canvas);
  ctx.clearRect(0, 0, w, h);
  const padL = 30, padB = 20, padT = 6, padR = 6;
  const iw = w - padL - padR, ih = h - padT - padB;
  const max = opts.max || Math.max(1, ...values);
  const n = values.length;
  ctx.font = "9px system-ui, sans-serif"; ctx.lineWidth = 1;
  for (let g = 0; g <= 4; g++) {
    const y = padT + ih - (ih * g / 4);
    ctx.strokeStyle = opts.border; ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
    ctx.fillStyle = opts.muted; ctx.textAlign = "right"; ctx.textBaseline = "middle";
    ctx.fillText(String(Math.round(max * g / 4)), padL - 4, y);
  }
  const pts = values.map((v, i) => [padL + (n === 1 ? iw / 2 : iw * i / (n - 1)), padT + ih - (v / max) * ih]);
  ctx.beginPath(); ctx.moveTo(pts[0][0], padT + ih);
  pts.forEach(p => ctx.lineTo(p[0], p[1]));
  ctx.lineTo(pts[n - 1][0], padT + ih); ctx.closePath();
  ctx.fillStyle = opts.color + "22"; ctx.fill();
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); pts.forEach(p => ctx.lineTo(p[0], p[1]));
  ctx.strokeStyle = opts.color; ctx.lineWidth = 2; ctx.lineJoin = "round"; ctx.lineCap = "round"; ctx.stroke();
  ctx.fillStyle = opts.color; ctx.beginPath(); ctx.arc(pts[n - 1][0], pts[n - 1][1], 3, 0, 7); ctx.fill();
  ctx.textBaseline = "top";
  ctx.fillStyle = opts.muted; ctx.textAlign = "left"; ctx.fillText(opts.leftLabel != null ? String(opts.leftLabel) : "0", padL, padT + ih + 3);
  ctx.textAlign = "right"; ctx.fillText(String(opts.rightLabel != null ? opts.rightLabel : values[n - 1]), w - padR, padT + ih + 3);
}

  if (state.habits.length) {

    state.habits.forEach(h => {

    });
    html += '</div>';
  }
  const earned = ACHIEVEMENTS.filter(a => state.achievements[a.id]).length;
  html += '<div class="card"><h3>Achievements <span class="muted" style="font-size:12px;font-weight:400">' + earned + '/' + ACHIEVEMENTS.length + '</span></h3><div class="ach-grid">' +

    '</div></div>';
  c.innerHTML = html;
  drawBarChart($("#chWeekly"), wk.labels, wk.values, { color: accent, muted, border, max: 100 });

/* --- schedule builder: time-based workout -> list of work/rest segments --- */
function buildSchedule(w) {
  const mode = w.mode || "interval";
  const exs = w.exercises || [];
  const segs = [];
  const pushWork = (e, round, roundOf) => segs.push({ type: "work", label: e.name, sec: e.duration * 1 || 0, round, roundOf });
  const pushRest = (sec, round, roundOf) => segs.push({ type: "rest", label: "REST", sec: sec * 1 || 0, round, roundOf });
  if (mode === "emom") {
    const rounds = w.rounds || 1;
    for (let r = 1; r <= rounds; r++) {
      const e = exs[(r - 1) % exs.length];
      const dur = e.duration * 1 || 40;
      pushWork(e, r, rounds);
      const rest = Math.max(0, 60 - dur);
      if (r < rounds) pushRest(rest, r, rounds);
    }
  } else if (mode === "amrap") {
    const cap = (w.cap || 600) * 1;
    let r = 1, total = 0, guard = 0;
    while (total < cap && guard < 1000) {
      for (let i = 0; i < exs.length; i++) {
        const e = exs[i];
        pushWork(e, r, -1); total += e.duration * 1;
        if (total >= cap) break;
        pushRest(e.rest * 1 || 10, r, -1); total += e.rest * 1 || 10;
      }
      r++; guard++;
    }
  } else {
    const rounds = w.rounds || 1;
    for (let r = 1; r <= rounds; r++) {
      exs.forEach((e, i) => {
        pushWork(e, r, rounds);
        const isLast = (r === rounds && i === exs.length - 1);
        if (!isLast) pushRest(e.rest == null ? 10 : e.rest * 1, r, rounds);
      });
    }
  }
  let total = 0;
  segs.forEach(s => { s.start = total; total += s.sec; });
  segs.forEach((s, i) => {
    for (let j = i + 1; j < segs.length; j++) { if (segs[j].type === "work") { s.nextLabel = segs[j].label; break; } }
    if (!s.nextLabel) s.nextLabel = "";
  });
  return { segs, total };
}

function startWorkout(id) {
  const w = state.workouts.find(x => x.id === id); if (!w) return;
  const sched = buildSchedule(w);
  if (!sched.segs.length) { toast("This workout has no exercises"); return; }
  const amrap = w.mode === "amrap";
  activeWorkout = {
    workoutId: w.id, name: w.name, mode: w.mode, amrap,
    cap: (w.cap || 600) * 1,
    schedule: sched.segs, total: sched.total,
    totalTarget: amrap ? Math.max(1, (w.cap || 600) * 1) : Math.max(1, sched.total),
    idx: 0, remaining: sched.segs[0].sec, elapsed: 0, paused: false, startedAt: Date.now()
  };
  document.getElementById("workoutOverlay").style.display = "flex";
  document.getElementById("woPause").textContent = "Pause";
  updateWorkoutUI();
  clearInterval(woIv);
  woIv = setInterval(workoutTick, 1000);
}
function workoutTick() {
  const w = activeWorkout; if (!w || w.paused) return;
  w.remaining--; w.elapsed++;
  updateWorkoutUI();
  if (w.remaining <= 0) {
    w.idx++;
    if (w.idx >= w.schedule.length) { cueDone(); endWorkout(true); return; }
    const seg = w.schedule[w.idx];
    w.remaining = seg.sec;
    if (seg.type === "rest") cueRest(); else cueGo();
    updateWorkoutUI();
  } else if (w.amrap && w.elapsed >= w.cap) {
    cueDone(); endWorkout(true);
  }
}
function updateWorkoutUI() {
  const w = activeWorkout; if (!w) return;
  const seg = w.schedule[w.idx];
  document.getElementById("woName").textContent = w.name;
  document.getElementById("woRound").textContent = w.mode === "emom" ? ("Minute " + seg.round + "/" + seg.roundOf) : (seg.roundOf > 0 ? ("Round " + seg.round + "/" + seg.roundOf) : ("Cycle " + seg.round));
  const pct = Math.min(100, Math.round((w.elapsed / w.totalTarget) * 100));
  document.getElementById("woPct").textContent = pct + "%";
  document.getElementById("woTime").textContent = fmtClock(w.remaining);
  document.getElementById("woFill").style.width = pct + "%";
  const cur = document.getElementById("woCurrent"), nxt = document.getElementById("woNext"), ph = document.getElementById("woPhase");
  if (seg.type === "rest") {
    cur.className = "wo-current rest"; cur.textContent = "REST";
    nxt.innerHTML = "UP NEXT&nbsp;&nbsp;<b>" + esc(seg.nextLabel || "") + "</b>";
    ph.textContent = seg.nextLabel ? "Break before " + seg.nextLabel : "Break";
  } else {
    cur.className = "wo-current"; cur.textContent = seg.label;
    nxt.innerHTML = seg.nextLabel ? "NEXT&nbsp;&nbsp;<b>" + esc(seg.nextLabel) + "</b>" : "";
    ph.textContent = w.mode === "amrap" ? "AMRAP - keep moving" : (w.mode === "emom" ? "EMOM" : "");
  }
}
function toggleWorkoutPause() {
  const w = activeWorkout; if (!w) return;
  w.paused = !w.paused;
  document.getElementById("woPause").textContent = w.paused ? "Resume" : "Pause";
}
function skipPhase() {
  const w = activeWorkout; if (!w) return;
  w.idx++;
  if (w.idx >= w.schedule.length) { cueDone(); endWorkout(true); return; }
  const seg = w.schedule[w.idx];
  w.remaining = seg.sec;
  if (seg.type === "rest") cueRest(); else cueGo();
  updateWorkoutUI();
}
function adjustPhase(delta) {
  const w = activeWorkout; if (!w) return;
  let r = w.remaining + delta;
  if (r <= 0) {
    w.idx++;
    if (w.idx >= w.schedule.length) { cueDone(); endWorkout(true); return; }
    w.remaining = w.schedule[w.idx].sec;
    cueGo();
  } else {
    w.remaining = r;
  }
  updateWorkoutUI();
}
function finishWorkout() {
  const w = activeWorkout; if (!w) return;
  if (!confirm("Finish and save this workout?")) return;
  endWorkout(true);
}
function quitWorkout() {
  const w = activeWorkout; if (!w) return;
  if (!confirm("Quit workout without saving?")) return;
  endWorkout(false);
}
function endWorkout(saveIt) {
  const w = activeWorkout;
  clearInterval(woIv);
  activeWorkout = null;
  document.getElementById("workoutOverlay").style.display = "none";
  if (saveIt && w) {
    const workSegs = w.schedule.filter(s => s.type === "work");
    const completed = workSegs.filter(s => w.elapsed >= s.start + s.sec).length;
    const exCount = {};
    workSegs.forEach(s => { if (w.elapsed >= s.start + s.sec) exCount[s.label] = (exCount[s.label] || 0) + 1; });
    const exercises = Object.keys(exCount).map(name => ({ name, sets: exCount[name] }));
    const kcal = Math.round((w.elapsed / 60) * 6);
    state.sessions.unshift({
      id: uid(), workoutId: w.workoutId, name: w.name, mode: w.mode, date: todayISO, completedAt: Date.now(),
      durationSec: w.elapsed, workDone: completed, workTotal: workSegs.length, exercises, kcal
    });
    addXp(XP_WORKOUT);
    toast("Workout saved");
    notify("Workout complete", w.name + " — " + fmtDuration(w.elapsed) + (kcal ? " · " + kcal + " kcal" : ""));
  }
  renderAll();
}

/* ---------------- Timer engine ---------------- */
let activeTimer = null, timerIv = null;
function startTimer(id) {
  const p = state.timerPresets.find(x => x.id === id); if (!p) return;
  const phases = [];
  for (let r = 1; r <= p.repeat; r++) for (const ph of p.phases) phases.push({ label: ph.label, sec: ph.sec, round: r, roundOf: p.repeat });
  activeTimer = { presetId: p.id, name: p.name, phases, idx: 0, remaining: phases[0].sec, total: phases[0].sec, paused: false, startedAt: Date.now(), done: false };
  $("#timerOverlay").style.display = "flex";
  $("#tStop").style.display = ""; $("#tClose").style.display = "none"; $("#tPause").style.display = "";
  $("#tPause").textContent = "Pause";
  updateTimerUI();
  cueGo();
  clearInterval(timerIv);
  timerIv = setInterval(tick, 1000);
}
function tick() {
  if (!activeTimer || activeTimer.paused || activeTimer.done) return;
  activeTimer.remaining--;
  updateTimerUI();
  if (activeTimer.remaining <= 0) {
    activeTimer.idx++;
    if (activeTimer.idx >= activeTimer.phases.length) { finishTimer(); return; }
    const ph = activeTimer.phases[activeTimer.idx];
    activeTimer.remaining = ph.sec; activeTimer.total = ph.sec;
    cueForLabel(ph.label);
    updateTimerUI();
  }
}
function updateTimerUI() {
  if (!activeTimer) return;
  const ph = activeTimer.phases[activeTimer.idx];
  document.getElementById("tName").textContent = activeTimer.name;
  document.getElementById("tPhase").textContent = ph.label + (ph.roundOf > 1 ? " · round " + ph.round + "/" + ph.roundOf : "");
  document.getElementById("tTime").textContent = fmtClock(activeTimer.remaining);
  document.getElementById("tFill").style.width = Math.max(0, Math.min(100, (activeTimer.remaining / activeTimer.total) * 100)) + "%";
}
function toggleTimerPause() {
  if (!activeTimer) return;
  activeTimer.paused = !activeTimer.paused;
  document.getElementById("tPause").textContent = activeTimer.paused ? "Resume" : "Pause";
}
function stopTimer() {
  clearInterval(timerIv); activeTimer = null;
  $("#timerOverlay").style.display = "none";
  renderAll();
}
function closeTimer() {
  clearInterval(timerIv); activeTimer = null;
  $("#timerOverlay").style.display = "none";
  save(); renderAll();
}
function finishTimer() {
  clearInterval(timerIv);
  activeTimer.done = true;
  cueDone();
  const dur = Math.round((Date.now() - activeTimer.startedAt) / 1000);
  state.timerLogs.unshift({ id: uid(), presetId: activeTimer.presetId, name: activeTimer.name, date: todayISO, durationSec: dur });
  addXp(XP_TIMER);
  notify("Timer complete", activeTimer.name + " — " + fmtDuration(dur));
  $("#tPause").style.display = "none"; $("#tStop").style.display = "none"; $("#tClose").style.display = "";
  $("#tPhase").textContent = "Complete!";
}

function summarizeDay(ds) {
  const dots = [], badges = [];

  const tcount = state.timerLogs.filter(l => l.date === ds).length;

/* ---------------- Google Drive sync ---------------- */
const GKEY = "alltimer_gdrive";
const DRIVE_FILE = "alltimer_sync_v1.json";
let gdrive = { clientId: "", accessToken: "", expiresAt: 0, fileId: "", lastSync: "", autoPush: false };
function loadGDrive() {
  try { const p = JSON.parse(localStorage.getItem(GKEY) || "{}"); gdrive = Object.assign({}, gdrive, p); } catch (e) {}
}
function saveGDrive() { try { localStorage.setItem(GKEY, JSON.stringify(gdrive)); } catch (e) {} }
function driveConnected() { return !!(gdrive.clientId && gdrive.accessToken); }
let gTokenClient = null, pushTimer = null;
function loadGsiScript() {
  return new Promise((res, rej) => {
    if (window.google && google.accounts) return res();
    const s = document.createElement("script");
    s.src = "https://accounts.google.com/gsi/client";
    s.async = true;
    s.onload = res; s.onerror = () => rej(new Error("could not load Google sign-in"));
    document.head.appendChild(s);
  });
}
function ensureToken() {
  return new Promise((res, rej) => {
    if (gdrive.accessToken && Date.now() < (gdrive.expiresAt || 0) - 30000) return res(gdrive.accessToken);
    if (!gdrive.clientId) return rej(new Error("Not connected to Google"));
    loadGsiScript().then(() => {
      gTokenClient = google.accounts.oauth2.initTokenClient({
        client_id: gdrive.clientId,
        scope: "https://www.googleapis.com/auth/drive.file",
        callback: tok => {
          if (tok.error) return rej(new Error(tok.error));
          gdrive.accessToken = tok.access_token;
          gdrive.expiresAt = (tok.expires_in || 3600) * 1000 + Date.now();
          saveGDrive();
          res(tok.access_token);
        }
      });
      gTokenClient.requestAccessToken();
    }).catch(rej);
  });
}
async function driveConnect() {
  const inp = $("#driveClientId");
  if (!inp) return;
  const cid = inp.value.trim();
  if (!cid) { toast("Paste your Google Client ID first"); return; }
  gdrive.clientId = cid; saveGDrive();
  setDriveBusy(true, "Connecting…");
  try {
    await loadGsiScript();
    gTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: cid,
      scope: "https://www.googleapis.com/auth/drive.file",
      callback: tok => {
        if (tok.error) { setDriveBusy(false); renderSettings(); toast("Google connection failed: " + tok.error); return; }
        gdrive.accessToken = tok.access_token;
        gdrive.expiresAt = (tok.expires_in || 3600) * 1000 + Date.now();
        saveGDrive();
        setDriveBusy(false);
        toast("Google Drive connected");
        renderSettings();
      }
    });
    gTokenClient.requestAccessToken();
  } catch (e) { setDriveBusy(false); toast("Failed to load Google sign-in: " + e.message); }
}
function setDriveBusy(on, label) {
  const dot = $("#driveDot");
  if (dot) { dot.classList.toggle("on", !on && driveConnected()); dot.classList.toggle("busy", on); }
  const t = $("#driveStatusText");
  if (t && label) t.textContent = label;
}
async function findDriveFile(token) {
  const url = "https://www.googleapis.com/drive/v3/files?q=" + encodeURIComponent("name='" + DRIVE_FILE + "' and trashed=false") + "&fields=files(id)&pageSize=5";
  const r = await fetch(url, { headers: { Authorization: "Bearer " + token } });
  if (!r.ok) throw new Error("Drive search failed (" + r.status + ")");
  const j = await r.json();
  return (j.files && j.files[0]) ? j.files[0].id : null;
}
async function createDriveFile(token) {
  const r = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=media", {
    method: "POST",
    headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
    body: JSON.stringify({})
  });
  if (!r.ok) throw new Error("Drive create failed (" + r.status + ")");
  const j = await r.json();
  await fetch("https://www.googleapis.com/drive/v3/files/" + j.id, {
    method: "PATCH",
    headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
    body: JSON.stringify({ name: DRIVE_FILE })
  });
  return j.id;
}
async function updateDriveFile(token, fileId, payload) {
  const r = await fetch("https://www.googleapis.com/upload/drive/v3/files/" + fileId + "?uploadType=media", {
    method: "PATCH",
    headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });
  if (!r.ok) throw new Error("Drive upload failed (" + r.status + ")");
  return true;
}
async function readDriveFile(token, fileId) {
  const r = await fetch("https://www.googleapis.com/drive/v3/files/" + fileId + "?alt=media", { headers: { Authorization: "Bearer " + token } });
  if (!r.ok) throw new Error("Drive download failed (" + r.status + ")");
  return await r.json();
}
function mergeStates(r) {
  const hm = {}; state.habits.forEach(h => hm[h.id] = 1);
  (r.habits || []).forEach(h => { if (!hm[h.id]) state.habits.push(h); });
  const wm = {}; state.workouts.forEach(w => wm[w.id] = 1);
  (r.workouts || []).forEach(w => { if (!wm[w.id]) state.workouts.push(w); });
  const tm = {}; state.timerPresets.forEach(t => tm[t.id] = 1);
  (r.timerPresets || []).forEach(t => { if (!tm[t.id]) state.timerPresets.push(t); });
  (Object.keys(r.habitLogs || {})).forEach(ds => {
    state.habitLogs[ds] = state.habitLogs[ds] || {};
    Object.keys(r.habitLogs[ds]).forEach(hid => {
      const rc = r.habitLogs[ds][hid], lc = state.habitLogs[ds][hid];
      if (!lc) state.habitLogs[ds][hid] = rc;
      else state.habitLogs[ds][hid] = { done: lc.done || rc.done, subtasks: Object.assign({}, rc.subtasks || {}, lc.subtasks || {}) };
    });
  });
  const sid = {}; state.sessions.forEach(s => sid[s.id] = 1);
  (r.sessions || []).forEach(s => { if (!sid[s.id]) state.sessions.push(s); });
  const tid = {}; state.timerLogs.forEach(t => tid[t.id] = 1);
  (r.timerLogs || []).forEach(t => { if (!tid[t.id]) state.timerLogs.push(t); });
  Object.keys(r.notes || {}).forEach(ds => { if (!state.notes[ds]) state.notes[ds] = r.notes[ds]; });
  state.xp = Math.max(state.xp || 0, r.xp || 0);
  Object.assign(state.achievements, r.achievements || {});
  state.sessions.sort((a, b) => String(b.date).localeCompare(String(a.date)) || (b.completedAt || 0) - (a.completedAt || 0));
}
async function pushToDrive(silent) {
  if (!silent) setDriveBusy(true, "Pushing…");
  try {
    const token = await ensureToken();
    let fileId = gdrive.fileId || await findDriveFile(token);
    if (!fileId) fileId = await createDriveFile(token);
    gdrive.fileId = fileId;
    const payload = JSON.parse(JSON.stringify(state));
    payload.syncedAt = new Date().toISOString();
    await updateDriveFile(token, fileId, payload);
    gdrive.lastSync = payload.syncedAt;
    saveGDrive();
    if (!silent) { toast("Pushed to Google Drive"); renderSettings(); }
  } catch (e) { if (!silent) { toast("Push failed: " + e.message); renderSettings(); } }
  setDriveBusy(false);
}
async function pullFromDrive() {
  setDriveBusy(true, "Pulling…");
  try {
    const token = await ensureToken();
    let fileId = gdrive.fileId || await findDriveFile(token);
    if (!fileId) { toast("Nothing on Drive yet — push first"); setDriveBusy(false); renderSettings(); return; }
    gdrive.fileId = fileId;
    const remote = await readDriveFile(token, fileId);
    if (!remote || !Array.isArray(remote.habits)) throw new Error("Invalid sync file");
    mergeStates(remote);
    gdrive.lastSync = new Date().toISOString();
    saveGDrive();
    save(); applyTheme(); renderAll(); scheduleReminders();
    toast("Merged data from Google Drive");
  } catch (e) { toast("Pull failed: " + e.message); }
  setDriveBusy(false); renderSettings();
}
function setupGuideHTML() {

    "<li><b>APIs &amp; Services → OAuth consent screen</b> → External → fill app name &amp; add your email as test user.</li>" +
    "<li><b>APIs &amp; Services → Credentials → Create credentials → OAuth Client ID → Web application</b>.</li>" +
    "<li>In <b>Authorized JavaScript origins</b> add <code>" + origin + "</code>" + (location.hostname === "localhost" ? "" : " (and <code>http://localhost:5500</code> for local testing)") + ".</li>" +
    "<li>Copy the <b>Client ID</b> (…<code>.apps.googleusercontent.com</code>) and paste it above, then click <b>Connect</b>.</li>" +
    "<li>Tokens in test mode expire after 7 days — publish the OAuth app (Status → Publish) to avoid re-approving.</li>" +
    "</ol></details>";
}

/* ---------------- Settings ---------------- */
function renderSettings() {
  const c = $("#content");
  const t = state.settings.theme;
  const seg = ["auto", "light", "dark"].map(v => '<button data-t="' + v + '" class="' + (t === v ? "on" : "") + '">' + v.charAt(0).toUpperCase() + v.slice(1) + "</button>").join("");
  const connected = driveConnected();
  const dot = '<span class="drive-dot' + (connected ? " on" : "") + '" id="driveDot"></span>';
  const status = connected ? ("Connected · last sync " + (gdrive.lastSync ? gdrive.lastSync.slice(0, 16).replace("T", " ") : "never")) : "Not connected yet.";
  c.innerHTML =
    '<div class="page-head"><h2>Settings</h2></div>' +
    '<div class="card"><h3>Appearance</h3>' +
      '<label class="field"><span>Theme</span><div class="seg" id="themeSeg">' + seg + "</div></label>" +
      '<div class="toggle-row"><span>Sound alerts</span><label class="toggle"><input type="checkbox" id="soundToggle" ' + (state.settings.sound ? "checked" : "") + '><span class="track"></span></label></div>' +
      '<div class="toggle-row" style="margin-top:12px"><span>Notifications</span><label class="toggle"><input type="checkbox" id="notifyToggle" ' + (state.settings.notify ? "checked" : "") + '><span class="track"></span></label></div>' +
      '<div class="muted" style="margin-top:8px">Alerts when timers / workouts finish, and daily habit reminders (only while this page is open).</div>' +
    "</div>" +
    '<div class="card"><h3>Data</h3>' +
      '<div class="muted" style="margin-bottom:12px">All your data is stored in this browser. Export a JSON backup regularly and keep it on Google Drive, then import it on any device.</div>' +
      '<div style="display:flex;flex-wrap:wrap;gap:8px">' +
        '<button class="btn" onclick="exportData()">Export backup</button>' +
        '<button class="btn ghost" onclick="document.getElementById(\'importFile3\').click()">Import backup</button>' +
        '<button class="btn danger-ghost" onclick="resetAll()">Reset all data</button>' +
      "</div>" +
      '<input type="file" id="importFile3" accept=".json,application/json" style="display:none" onchange="importFile(this)">' +
    "</div>" +
    '<div class="card"><h3 class="drive-head">' + dot + "<span>Google Drive sync</span></h3>" +
      '<div class="hint" style="margin:2px 0 12px">Keep your data in sync across devices automatically. Requires a free Google OAuth Client ID.</div>' +
      '<label class="field"><span>Google OAuth Client ID</span><input class="input" id="driveClientId" value="' + esc(gdrive.clientId || "") + '" placeholder="xxxx.apps.googleusercontent.com"></label>' +
      '<div class="drive-actions">' +
        '<button class="btn" onclick="driveConnect()">' + (connected ? "Reconnect" : "Connect Google") + "</button>" +
        '<button class="btn ghost" onclick="pushToDrive()">Push to Drive</button>' +
        '<button class="btn ghost" onclick="pullFromDrive()">Pull from Drive</button>' +
      "</div>" +
      '<div class="toggle-row" style="margin-top:12px"><span>Auto push after each change</span><label class="toggle"><input type="checkbox" id="autoPushToggle" ' + (gdrive.autoPush ? "checked" : "") + '><span class="track"></span></label></div>' +
      '<div class="muted" id="driveStatusText" style="margin-top:8px">' + status + "</div>" +
      setupGuideHTML() +
    "</div>" +
    '<div class="card"><h3>Offline & hosting</h3>' +
      '<div class="muted" style="line-height:1.6">This app works fully offline from a single file. To access it from your phone anywhere:' +
      "<ul style=\"margin:8px 0 0;padding-left:18px\">" +
      "<li>Open this <code>index.html</code> on your phone — everything is local.</li>" +
      "<li>Or host it free on GitHub Pages / Netlify, then open the URL on both devices.</li>" +
      "<li>Move backups between devices via the Export / Import buttons.</li></ul></div>" +
    "</div>";
  $("#themeSeg").querySelectorAll("button").forEach(b => b.onclick = () => {
    state.settings.theme = b.dataset.t; save(); applyTheme();
    $("#themeSeg").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
  });
  $("#soundToggle").onchange = e => { state.settings.sound = e.target.checked; save(); };
  $("#notifyToggle").onchange = e => {
    if (e.target.checked) {
      if ("Notification" in window && Notification.permission === "granted") {
        state.settings.notify = true; save(); scheduleReminders(); return;
      }
      e.target.checked = false;
      try {
        Notification.requestPermission().then(p => {
          state.settings.notify = (p === "granted");
          save(); scheduleReminders(); renderSettings();
          toast(p === "granted" ? "Notifications enabled" : "Notifications denied");
        });
      } catch (err) { toast("Notifications not supported"); }
    } else {
      state.settings.notify = false; save(); scheduleReminders();
    }
  };
  const cid = $("#driveClientId");
  if (cid) cid.addEventListener("change", () => { gdrive.clientId = cid.value.trim(); saveGDrive(); });
  const at = $("#autoPushToggle");
  if (at) at.addEventListener("change", e => { gdrive.autoPush = e.target.checked; saveGDrive(); toast(gdrive.autoPush ? "Auto push enabled" : "Auto push disabled"); });
}

/* ---------------- Export / Import / Reset ---------------- */
function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "alltimer-backup-" + todayISO + ".json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast("Backup downloaded");
}
function importFile(input) {
  const f = input.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const p = JSON.parse(r.result);
      if (!p || !Array.isArray(p.habits)) throw new Error("Not an AllTimer backup");
      const d = defaultData();
      Object.assign(state, d, p);
      state.settings = Object.assign({}, d.settings, p.settings || {});
      migrate();
      save(); applyTheme(); renderAll(); scheduleReminders(); toast("Data imported");
    } catch (e) { toast("Import failed: " + e.message); }
    input.value = "";
  };
  r.readAsText(f);
}
function resetAll() {
  if (!confirm("Delete ALL data? This cannot be undone. Export a backup first.")) return;
  localStorage.removeItem(KEY);
  load(); applyTheme(); renderAll(); scheduleReminders(); toast("Data reset");
}

/* ---------------- Navigation ---------------- */
let currentView = "today";
function switchView(v) {
  currentView = v;
  document.querySelectorAll(".nav button").forEach(b => b.classList.toggle("active", b.dataset.view === v));
  renderAll();
}
function renderAll() {
  closeModal();
  if (currentView === "today") renderToday();
  else if (currentView === "habits") renderHabits();
  else if (currentView === "workouts") renderWorkouts();
  else if (currentView === "timers") renderTimers();
  else if (currentView === "stats") renderStats();
  else if (currentView === "books") renderBooks();
  else if (currentView === "calendar") renderCalendar();
  else if (currentView === "settings") renderSettings();
}

/* ---------------- Init ---------------- */
function setNavIcons() {
  document.querySelectorAll(".nav button").forEach(b => {
    const i = b.querySelector("i");
    if (i && ICONS[b.dataset.view]) i.innerHTML = ICONS[b.dataset.view];
  });
  const logoSvg = ICONS.timers;
  const l1 = $("#logo"), l2 = $("#logo2");
  if (l1) l1.innerHTML = logoSvg;
  if (l2) l2.innerHTML = logoSvg;
}
function init() {
  load();
  loadGDrive();
  setNavIcons();
  applyTheme();
  document.querySelectorAll(".nav button").forEach(b => b.addEventListener("click", () => switchView(b.dataset.view)));
  document.getElementById("themeBtnTop").addEventListener("click", quickTheme);
  document.getElementById("themeBtn").addEventListener("click", quickTheme);
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
  scheduleReminders();
  switchView("today");
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
}
document.addEventListener("DOMContentLoaded", init);
</script>
